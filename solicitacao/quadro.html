<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadro de Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101820;
    --board-bg: #0b1119;
    --col-bg: #17202b;
    --col-header: #1c2632;
    --card-bg: #212d3b;
    --card-hover: #29394a;
    --border: #2a3644;
    --text: #e8ecf1;
    --text-dim: #8b98a8;

    --aberto: #f2a541;
    --aberto-bg: rgba(242, 165, 65, 0.12);
    --cotacao: #4ea1f2;
    --cotacao-bg: rgba(78, 161, 242, 0.12);
    --finalizado: #4ecb8f;
    --finalizado-bg: rgba(78, 203, 143, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
  }

  .board-header {
    max-width: 1200px;
    margin: 0 auto 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .board-header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .board-header p {
    color: var(--text-dim);
    font-size: 14px;
  }

  .board {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    align-items: start;
  }

  .column {
    background: var(--col-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 160px);
    transition: background 0.15s ease;
  }

  .column.drag-over {
    background: var(--card-hover);
  }

  .column-header {
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
  }

  .column-header .title-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .col-aberto .dot { background: var(--aberto); }
  .col-cotacao .dot { background: var(--cotacao); }
  .col-finalizado .dot { background: var(--finalizado); }

  .column-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .count {
    font-size: 12px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.05);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }

  .card-list {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    flex: 1;
    min-height: 80px;
  }

  .card-list:empty::after {
    content: "Nenhum card por aqui";
    display: block;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 24px 8px;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--aberto);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: grab;
    transition: background 0.15s ease, transform 0.1s ease;
    position: relative;
  }

  .col-cotacao .card { border-left-color: var(--cotacao); }
  .col-finalizado .card { border-left-color: var(--finalizado); }

  .card:hover {
    background: var(--card-hover);
  }

  .card.dragging {
    opacity: 0.4;
  }

  .card p {
    font-size: 13.5px;
    line-height: 1.45;
    padding-right: 18px;
  }

  .card .remove-card {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
  }

  .card:hover .remove-card {
    opacity: 1;
  }

  .card .remove-card:hover {
    color: #f2685f;
  }

  .add-card-area {
    padding: 10px 12px 14px;
    border-top: 1px solid var(--border);
  }

  .add-card-form {
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .add-card-form.active {
    display: flex;
  }

  .add-card-form textarea {
    resize: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    padding: 10px 12px;
    min-height: 56px;
  }

  .add-card-form textarea:focus {
    outline: none;
    border-color: var(--text-dim);
  }

  .add-card-form .form-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-confirm {
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-cancel {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
  }

  .btn-add-card {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-dim);
    text-align: left;
    font-size: 13.5px;
    padding: 8px 6px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-add-card:hover {
    background: rgba(255,255,255,0.05);
    color: var(--text);
  }

  .btn-add-card.hidden {
    display: none;
  }

  @media (max-width: 860px) {
    .board {
      grid-template-columns: 1fr;
    }
    .column {
      max-height: none;
    }
  }
</style>
</head>
<body>

<div class="board-header">
  <div>
    <h1>Quadro de Tarefas</h1>
    <p>Arraste os cards entre as colunas para atualizar o status</p>
  </div>
</div>

<div class="board" id="board">

  <!-- Coluna: Em aberto -->
  <div class="column col-aberto" data-status="aberto">
    <div class="column-header">
      <div class="title-group">
        <span class="dot"></span>
        <h2>Em aberto</h2>
      </div>
      <span class="count">0</span>
    </div>
    <div class="card-list" data-list="aberto">
      <div class="card" draggable="true">
        <p>Levantar requisitos do cliente</p>
        <button class="remove-card" title="Remover card">&times;</button>
      </div>
      <div class="card" draggable="true">
        <p>Agendar visita técnica</p>
        <button class="remove-card" title="Remover card">&times;</button>
      </div>
    </div>
    <div class="add-card-area">
      <button class="btn-add-card">+ Adicionar card</button>
      <div class="add-card-form">
        <textarea placeholder="Descreva o card..."></textarea>
        <div class="form-actions">
          <button class="btn-confirm">Adicionar</button>
          <button class="btn-cancel">&times;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Coluna: Cotação -->
  <div class="column col-cotacao" data-status="cotacao">
    <div class="column-header">
      <div class="title-group">
        <span class="dot"></span>
        <h2>Cotação</h2>
      </div>
      <span class="count">0</span>
    </div>
    <div class="card-list" data-list="cotacao">
      <div class="card" draggable="true">
        <p>Solicitar orçamento com 3 fornecedores</p>
        <button class="remove-card" title="Remover card">&times;</button>
      </div>
    </div>
    <div class="add-card-area">
      <button class="btn-add-card">+ Adicionar card</button>
      <div class="add-card-form">
        <textarea placeholder="Descreva o card..."></textarea>
        <div class="form-actions">
          <button class="btn-confirm">Adicionar</button>
          <button class="btn-cancel">&times;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Coluna: Finalizado -->
  <div class="column col-finalizado" data-status="finalizado">
    <div class="column-header">
      <div class="title-group">
        <span class="dot"></span>
        <h2>Finalizado</h2>
      </div>
      <span class="count">0</span>
    </div>
    <div class="card-list" data-list="finalizado">
      <div class="card" draggable="true">
        <p>Aprovação do orçamento inicial</p>
        <button class="remove-card" title="Remover card">&times;</button>
      </div>
    </div>
    <div class="add-card-area">
      <button class="btn-add-card">+ Adicionar card</button>
      <div class="add-card-form">
        <textarea placeholder="Descreva o card..."></textarea>
        <div class="form-actions">
          <button class="btn-confirm">Adicionar</button>
          <button class="btn-cancel">&times;</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="quadro.js"></script>

</body>
</html>
